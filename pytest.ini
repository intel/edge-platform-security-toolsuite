[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.8

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra
    --color=yes

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(funcName)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Markers
markers =
    tme: TME (Total Memory Encryption) tests
    aesni: AES-NI (AES New Instructions) tests
    txt: TXT (Trusted Execution Technology) tests
    measured_boot: Measured Boot tests (fTPM/dTPM)
    firmware: Firmware update tests
    csme: CSME (Converged Security and Manageability Engine) tests
    pavp: PAVP (Protected Audio Video Path) tests
    rpmc: RPMC (Replay Protected Monotonic Counter) tests
    secure_debug: Secure Debug tests
    eom: EOM (End of Manufacturing) tests
    virtualization: Virtualization (VT-d/VMX) tests
    sha_extension: SHA Extension (AES-NI/SHA-NI openssl benchmark) tests
    bios_resiliency: BIOS Resiliency / Recovery tests
    hlat: HLAT (VT-rp / Hypervisor Linear Address Translation) tests
    cet: CET (Control-flow Enforcement Technology / ShadowStack) tests
    hdcp: HDCP (High-bandwidth Digital Content Protection) tests
    slow: Slow running tests (> 5 minutes)
    manual: Tests requiring manual intervention
    timeout(seconds): pytest-timeout per-test override (0 = no timeout); registered here so --strict-markers passes without the plugin
    # Execution-context markers -- auto-applied in conftest.py by filename suffix
    nuc_driven: runs on the NUC, drives a Linux SUT over SSH
    sut_linux: runs directly on the Linux SUT (no NUC)
    wins_driven: runs on the NUC/host, drives a Windows SUT over SSH
    sut_windows: runs directly on the Windows SUT (no NUC)
    # IFWI-group markers -- auto-applied in conftest.py; tests sharing a group
    # share the same flashed IFWI and can run back-to-back without reflashing.
    # Linux SUT tests other than fTPM/dTPM/Resiliency carry both ifwi_sep5 and ifwi_sed5.
    ifwi_sep5: runs on Bootguard5 EXTERNAL RPSF_SEP5 IFWI (PTT; default group)
    ifwi_sed5: runs on Bootguard5 EXTERNAL RPSF_SED5 IFWI (dTPM; also every Linux test but fTPM)
    ifwi_resiliency: needs the custom Resiliency-ROM IFWI build
    # Auto-applied in conftest.py (core/test_selection.SECURE_BOOT_RULES)
    secure_boot: needs UEFI Secure Boot enabled before the test starts

# Timeout for tests (in seconds)
timeout = 1800

# Result caching for failed test re-runs
# The cache is stored in .pytest_cache/
cache_dir = .pytest_cache

# Coverage options (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = --cov=core --cov-report=html --cov-report=term

# HTML report options (if pytest-html is installed)
# Uncomment to enable HTML reporting
# addopts = --html=logs/report.html --self-contained-html

# Parallel execution (if pytest-xdist is installed)
# Uncomment to enable parallel execution
# addopts = -n auto

# Retry failed tests (if pytest-rerunfailures is installed)
# Uncomment to enable automatic retries
# addopts = --reruns 2 --reruns-delay 5

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
